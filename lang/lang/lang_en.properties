about.name=About 550WOS
about.intro=Introduction
about.update=Update log
about.intro.name=<span></span>550WOS
about.intro.intro=<span></span>Introduction
about.intro.intro.p1=550WOS is an open source project, maintained by ShiZhongyan. It use HTML, CSS and JS to simulate and innovate 550WOS online.
about.intro.intro.p2=&emsp;&emsp;This project is published on GitHub, <a onclick\="window.open('https\://github.com/SZYInnovationStudio/550WOS','_blank');" win12_title\="https\://github.com/SZYInnovationStudio/550WOS" class\="jump">click here to view</a>.
about.intro.intro.p3=&emsp;&emsp;If you have any comments or suggestions about this project, please <a onclick\="window.open('https\://github.com/SZYInnovationStudio/550WOS/issues','_blank');" win12_title\="https\://github.com/SZYInnovationStudio/550WOS/issues" class\="jump">submit issues on GitHub</a>, and your problem will be resolved as soon as possible.
about.intro.intro.p4=This project is maintained by the developer ShiZhongyan, click for <a class\="jump" win12_title\="https\://github.com/ShiZhongyanGH" onclick\="window.open('https\://github.com/ShiZhongyanGH','_blank')">more information</a>.
about.intro.os=<span></span>Open Source License
about.intro.os.p1=It is an open source project, using the EPL v2.0 licence. Open source licence is a contract with legal effect. Please consciously abide by it and respect the labor of others.
about.intro.os.p2=According to the licence, you can disseminate, distribute, modify and re publish the project, including personal and commercial purposes.
about.intro.os.p3=But you must indicate the source of the code, <strong>including the author, project link, etc.</strong>, and the code must be open source.
about.intro.os.p4=And if it is not added or modified on the basis of the project, it does not need open source. But also only for learning purposes.
about.intro.contri=<span></span>Contributors
about.intro.contri.p1=Thanks to all project contributors (real-time data, by the number of Commits)
about.intro.star.p1=&emsp;&emsp;Thanks to <a class\="jump" win12_title\="How about giving a Star? (Jumping to\: https\://github.com/SZYInnovationStudio/550WOS/stargazers)" onclick\="window.open('https\://github.com/SZYInnovationStudio/550WOS/stargazers','_blank')">everyone who supports us</a>.
about.intro.others=<span></span>Others
about.intro.others.p1=This project is based on the current version of 550WOS and is not consistent with official version of 550WOS.
about.intro.others.p2=This project is created by UEG.
about.intro.others.p3=UEG, 550WOS, and other demonstration products in this project are trademarks of UEG. Android in this project is a trademark of Google Inc.
about.intro.others.p4=&emsp;&emsp;If you see this page on a website other than this project (https\://550w.szyd.fun), you may be browsing a mirror site. To visit the original page, please click <a class\="jump" win12_title\="https\://550w.szyd.fun" onclick\="window.open('https\://550w.szyd.fun','_blank')">here</a>.
about.update.name=<span></span>Update log
about.intro.disclaimer=<span></span>Disclaimers
about.intro.disclaimer.p1=  550WOS (abbreviated as "550WOS" or "this project" below) is a <strong>purely non-commercial open-source hobby project</strong> that explores and simulates graphical operating system interaction experiences through web technologies.
about.intro.disclaimer.p2=  This project is created by UEG.
about.intro.disclaimer.p3=  The project name "550WOS" and similar references are names of the UEG operating system.
about.intro.disclaimer.p4=  All visual elements, including layout designs and color schemes, are the result of <strong>independent re-creation</strong> by the developers based on publicly available materials. They are not copies, modifications, or derivatives of UEG's original copyrighted assets.
about.intro.disclaimer.p5=  Most icons have been redrawn by the developers. The reference icons for these redraws, as well as the few remaining icons which are not redrawn, are icons from the current version of 550WOS and are used solely for identification and display purposes. Their copyright belongs to UEG.


